<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Disaster Command Center</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Container -->

    <div class="container">

        <!-- Top Navigation -->

        <header class="navbar">

            <h2>AI Disaster Command Center</h2>

        </header>

        <!-- Sidebar -->

        <aside class="sidebar">

            <h3>🌍 Menu</h3>

<ul>
    <li>Dashboard</li>
    <li>Satellite Map</li>
    <li>AI Analysis</li>
    <li>Disaster Alerts</li>
    <li>Resources</li>
    <li>Settings</li>
</ul>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <h2>🛰️ Disaster Monitoring Dashboard</h2>

<div class="cards">

    <div class="card">
        <h3>Flood Risk</h3>
        <p>Low</p>
    </div>

    <div class="card">
        <h3>Earthquake</h3>
        <p>No Activity</p>
    </div>

    <div class="card">
        <h3>Wildfire</h3>
        <p>Moderate</p>
    </div>

    <div class="card">
        <h3>Cyclone</h3>
        <p>Tracking...</p>
    </div>

</div>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
