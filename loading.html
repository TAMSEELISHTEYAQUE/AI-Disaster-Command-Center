<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Disaster Command Center | Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/loading.css" />
  </head>
  <body>
    <div class="loading-shell">
      <div class="glass-panel loader-card">
        <div class="loader-ring">
          <div class="loader-progress"></div>
        </div>
        <h1>Initializing command layer</h1>
        <p id="statusText">Loading mission data and secure channels...</p>
        <div class="progress-bar">
          <span id="progressFill"></span>
        </div>
        <small>Redirecting you to the dashboard shortly.</small>
      </div>
    </div>

    <script src="js/loading.js"></script>
  </body>
</html>
